<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard động</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --line: #e5e7eb;
      --line-soft: #eef2f7;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --radius: 18px;
      --gap: 16px;
    }
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    html, body { margin: 0; padding: 0; color: var(--text); }
    body.widget-resizing, body.widget-resizing * { cursor: nwse-resize !important; user-select: none !important; }
    .page { max-width: 1440px; margin: 0 auto; padding: 20px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .topbar-left h1 { margin: 0; font-size: 28px; line-height: 1.2; }
    .topbar-left .sub { margin-top: 6px; color: var(--muted); font-size: 14px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
    button, select, input { border: 1px solid #d1d5db; border-radius: 12px; background: #fff; color: var(--text); padding: 10px 12px; font-size: 14px; outline: none; }
    button { cursor: pointer; transition: 0.15s ease; }
    button:hover { border-color: #b7c2d0; transform: translateY(-1px); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-box { background: var(--card); padding: 14px; border-radius: 14px; border: 1px solid var(--line); min-width: 220px; box-shadow: var(--shadow); }
    .filter-box label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .filter-box input, .filter-box select { width: 100%; }
    .status-bar { margin: 0 0 16px; padding: 10px 12px; border-radius: 12px; background: #eef6ff; color: #1d4ed8; border: 1px solid #dbeafe; font-size: 13px; display: none; }
    .status-bar.show { display: block; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap); align-items: start; }
    .widget { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; min-height: 120px; box-shadow: var(--shadow); transition: box-shadow 0.15s ease, border-color 0.15s ease; }
    .widget:hover { box-shadow: 0 12px 28px rgba(15, 23, 42, 0.09); }
    .widget.dragging { opacity: 0.55; border: 2px dashed var(--primary); }
    .widget.resizing { border-color: #93c5fd; box-shadow: 0 12px 30px rgba(37, 99, 235, 0.16); }
    .widget.chart-widget .widget-body { overflow: hidden; }
    .widget-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #f1f5f9; background: #fbfdff; cursor: move; }
    .widget-title-wrap { min-width: 0; }
    .widget-title { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.25; }
    .widget-desc { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .widget-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; flex-shrink: 0; }
    .widget-body { padding: 16px; }
    .widget-resize-handle { position: absolute; right: 10px; bottom: 10px; width: 18px; height: 18px; border: 0; border-right: 3px solid #94a3b8; border-bottom: 3px solid #94a3b8; background: transparent; cursor: nwse-resize; padding: 0; z-index: 3; opacity: 0.85; touch-action: none; }
    .widget:hover .widget-resize-handle, .widget.resizing .widget-resize-handle { border-color: var(--primary); opacity: 1; }
    .chart-wrap { position: relative; width: 100%; height: 320px; min-height: 220px; overflow: hidden; }
    .chart-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
    .legend-note { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .kpi-card { color: white; border-radius: 16px; padding: 18px; min-height: 140px; display: flex; flex-direction: column; justify-content: center; }
    .kpi-title { font-size: 15px; opacity: 0.95; margin-bottom: 10px; font-weight: 600; }
    .kpi-value { font-size: 40px; font-weight: 700; line-height: 1; margin-bottom: 10px; }
    .kpi-subtitle { font-size: 14px; opacity: 0.9; }
    .table-wrap { overflow-x: auto; border: 1px solid #edf2f7; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); text-align: left; font-size: 14px; white-space: nowrap; }
    th { background: #f8fafc; font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    .print-root { display: none; }
    @media (max-width: 992px) {
      .page { padding: 14px; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .widget { grid-column: span 1 !important; }
      .widget-resize-handle { right: 8px; bottom: 8px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="topbar-left">
        <h1 id="dashboardTitle"></h1>
        <div id="dashboardDescription" class="sub"></div>
      </div>
      <div class="toolbar">
        <button class="btn-primary" onclick="exportPdfLayout()">Export PDF</button>
        <button onclick="saveLayout()">Lưu layout</button>
        <button onclick="resetLayout()">Reset layout</button>
      </div>
    </div>
    <div id="statusBar" class="status-bar"></div>
    <div id="filters" class="filters"></div>
    <div id="dashboard" class="dashboard-grid"></div>
  </div>
  <div id="printRoot" class="print-root"></div>
  <script>
    const CHART_TYPES = [{"value":"bar","label":"Biểu đồ cột"},{"value":"line","label":"Biểu đồ đường"},{"value":"area","label":"Biểu đồ vùng"},{"value":"pie","label":"Biểu đồ tròn"},{"value":"doughnut","label":"Biểu đồ vành khuyên"},{"value":"radar","label":"Biểu đồ radar"},{"value":"polarArea","label":"Biểu đồ vùng cực"},{"value":"scatter","label":"Biểu đồ phân tán"}];
    const dashboardConfig = {"id":"dashboard","title":"Dashboard","description":"Dashboard cấu hình động từ JSON","filters":[],"widgets":[{"id":"w1","type":"kpi","title":"Tổng tiền hóa đơn chưa thanh toán","desc":"Tính theo nội tệ","width":3,"height":2,"color":"linear-gradient(135deg, #0f5cc0, #1667c9)","value":380828,"subtitle":"Đơn vị: VND"},{"id":"w2","type":"kpi","title":"Tổng tiền quá hạn","desc":"Tính theo nội tệ","width":3,"height":2,"color":"linear-gradient(135deg, #0b86cf, #18a2d8)","value":286591,"subtitle":"Đơn vị: VND"},{"id":"w3","type":"kpi","title":"Quá hạn trên 30 ngày","desc":"Tính theo nội tệ","width":3,"height":2,"color":"linear-gradient(135deg, #13b7a3, #26cf7e)","value":201475,"subtitle":"Đơn vị: VND"},{"id":"w4","type":"kpi","title":"Quá hạn trên 90 ngày","desc":"Tính theo nội tệ","width":3,"height":2,"color":"linear-gradient(135deg, #7f4fc7, #9b59d0)","value":148983,"subtitle":"Đơn vị: VND"},{"id":"w5","type":"chart","title":"Công nợ theo khách hàng","desc":"Top khách hàng có dư nợ cao","width":7,"height":5,"chartType":"bar","data":{"labels":["Stripe Inc","Gala SARL","Wozel & Co. LLP","UK&A Services LLC","Business Technologies Inc"],"values":[127520,85116,79400,73792,15000]}},{"id":"w6","type":"chart","title":"Tỷ trọng công nợ khách hàng","desc":"Tỷ lệ trên tổng công nợ","width":5,"height":5,"chartType":"doughnut","data":{"labels":["Stripe Inc","Gala SARL","Wozel & Co. LLP","UK&A Services LLC","Business Technologies Inc"],"values":[127520,85116,79400,73792,15000]}},{"id":"w7","type":"chart","title":"Xu hướng công nợ theo tháng","desc":"Theo dõi biến động 6 tháng","width":6,"height":4,"chartType":"line","data":{"labels":["05/2025","06/2025","07/2025","08/2025","09/2025","10/2025"],"values":[220000,265000,240000,310000,335000,380828]}},{"id":"w8","type":"chart","title":"Hiệu suất thu hồi công nợ","desc":"So sánh các nhóm khách hàng","width":6,"height":4,"chartType":"radar","data":{"labels":["Nhóm A","Nhóm B","Nhóm C","Nhóm D","Nhóm E"],"values":[82,71,76,64,88]}},{"id":"w9","type":"chart","title":"Phân bố rủi ro thanh toán","desc":"Mức độ rủi ro theo nhóm","width":6,"height":4,"chartType":"polarArea","data":{"labels":["Rất thấp","Thấp","Trung bình","Cao","Rất cao"],"values":[8,16,29,21,9]}},{"id":"w10","type":"chart","title":"Phân tán tuổi nợ / giá trị","desc":"Scatter theo số ngày nợ và số tiền","width":6,"height":4,"chartType":"scatter","data":{"points":[{"x":8,"y":12000},{"x":16,"y":25000},{"x":23,"y":48000},{"x":35,"y":62000},{"x":46,"y":73000},{"x":61,"y":81000},{"x":74,"y":92000},{"x":93,"y":110000}]}},{"id":"w11","type":"table","title":"Danh sách hóa đơn chưa thanh toán","desc":"Chi tiết các chứng từ mở","width":12,"height":4,"columns":["Khách hàng","Số hóa đơn","Ngày hóa đơn","Ngày đến hạn","Số tiền còn lại"],"rows":[["Gala SARL","INV-0080","30/08/2025","15/09/2025","85,116"],["UK&A Services LLC","INV-0081","01/10/2025","30/11/2025","67,329"],["Wozel & Co. LLP","INV-0079","30/09/2025","20/10/2025","26,908"],["Wozel & Co. LLP","INV-0077","30/08/2025","01/09/2025","26,630"],["Stripe Inc","INV-0074","17/08/2025","01/09/2025","127,520"]]}]};
    const defaultWidgets = JSON.parse(JSON.stringify(dashboardConfig.widgets));
    const chartInstances = {};
    const widgetResizeConfig = { minWidth: 3, maxWidth: 12, minHeight: 2, maxHeight: 8, heightStepPx: 80 };
    let dragSourceId = null;
    let resizeState = null;
    let viewportResizeTimer = null;
    function init() {
      loadLayout();
      var titleEl = document.getElementById("dashboardTitle");
      var descEl = document.getElementById("dashboardDescription");
      if (titleEl) titleEl.textContent = dashboardConfig.title || "";
      if (descEl) descEl.textContent = dashboardConfig.description || "";
      renderFilters();
      renderDashboard();
      bindPrintHooks();
    }
    function loadLayout() {
      const saved = localStorage.getItem("dashboard-layout-" + dashboardConfig.id);
      if (!saved) return;
      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length) dashboardConfig.widgets = parsed;
      } catch (e) { console.error("Lỗi parse layout:", e); }
    }
    function renderFilters() {
      const filtersEl = document.getElementById("filters");
      filtersEl.innerHTML = "";
      dashboardConfig.filters.forEach(function(filter) {
        const box = document.createElement("div");
        box.className = "filter-box";
        const label = document.createElement("label");
        label.textContent = filter.label || "";
        box.appendChild(label);
        if (filter.type === "select") {
          const select = document.createElement("select");
          (filter.options || []).forEach(function(opt) {
            const option = document.createElement("option");
            option.value = opt;
            option.textContent = opt || "Tất cả";
            option.selected = opt === filter.value;
            select.appendChild(option);
          });
          select.addEventListener("change", function() { filter.value = this.value; reloadData(); });
          box.appendChild(select);
        }
        if (filter.type === "date-range") {
          const input = document.createElement("input");
          input.type = "text";
          input.value = filter.value || "";
          input.addEventListener("change", function() { filter.value = this.value; reloadData(); });
          box.appendChild(input);
        }
        filtersEl.appendChild(box);
      });
    }
    function renderDashboard() {
      const dashboard = document.getElementById("dashboard");
      destroyCharts();
      dashboard.innerHTML = "";
      dashboardConfig.widgets.forEach(function(widget) {
        const widgetEl = document.createElement("div");
        widgetEl.className = "widget";
        widgetEl.draggable = true;
        widgetEl.dataset.widgetId = widget.id;
        if (widget.type === "chart") widgetEl.classList.add("chart-widget");
        applyWidgetDimensions(widget, widgetEl);
        widgetEl.addEventListener("dragstart", onDragStart);
        widgetEl.addEventListener("dragover", onDragOver);
        widgetEl.addEventListener("drop", onDrop);
        widgetEl.addEventListener("dragend", onDragEnd);
        const header = document.createElement("div");
        header.className = "widget-header";
        const titleWrap = document.createElement("div");
        titleWrap.className = "widget-title-wrap";
        const title = document.createElement("h3");
        title.className = "widget-title";
        title.textContent = widget.title || "";
        titleWrap.appendChild(title);
        if (widget.desc) {
          const desc = document.createElement("div");
          desc.className = "widget-desc";
          desc.textContent = widget.desc;
          titleWrap.appendChild(desc);
        }
        const actions = document.createElement("div");
        actions.className = "widget-actions";
        if (widget.type === "chart") {
          const typeSelect = document.createElement("select");
          prepareWidgetControl(typeSelect);
          CHART_TYPES.forEach(function(item) {
            const option = document.createElement("option");
            option.value = item.value;
            option.textContent = item.label;
            option.selected = item.value === widget.chartType;
            typeSelect.appendChild(option);
          });
          typeSelect.addEventListener("change", function(e) {
            widget.chartType = e.target.value;
            persistLayout();
            renderDashboard();
          });
          actions.appendChild(typeSelect);
        }
        header.appendChild(titleWrap);
        header.appendChild(actions);
        const body = document.createElement("div");
        body.className = "widget-body";
        if (widget.type === "kpi") {
          body.innerHTML = '<div class="kpi-card" style="background:' + (widget.color || "#2563eb") + '">' +
                           '<div class="kpi-title">' + escapeHtml(widget.title) + '</div>' +
                           '<div class="kpi-value">' + formatNumber(widget.value || 0) + '</div>' +
                           '<div class="kpi-subtitle">' + escapeHtml(widget.subtitle || "") + '</div>' +
                           '</div>';
        }
        if (widget.type === "chart") {
          const chartWrap = document.createElement("div");
          chartWrap.className = "chart-wrap";
          chartWrap.style.height = getChartCanvasHeight(widget) + "px";
          const canvas = document.createElement("canvas");
          canvas.id = "chart-" + widget.id;
          chartWrap.appendChild(canvas);
          body.appendChild(chartWrap);
          const note = document.createElement("div");
          note.className = "legend-note";
          note.textContent = "Có thể đổi loại biểu đồ và resize khung ở góc phải dưới.";
          body.appendChild(note);
          const resizeHandle = document.createElement("button");
          resizeHandle.type = "button";
          resizeHandle.className = "widget-resize-handle";
          resizeHandle.title = "Resize chart";
          prepareWidgetControl(resizeHandle);
          resizeHandle.addEventListener("pointerdown", function(event) { startWidgetResize(event, widget, widgetEl); });
          widgetEl.appendChild(resizeHandle);
        }
        if (widget.type === "table") {
          const wrap = document.createElement("div");
          wrap.className = "table-wrap";
          wrap.innerHTML = buildTableHtml(widget.columns || [], widget.rows || []);
          body.appendChild(wrap);
        }
        widgetEl.appendChild(header);
        widgetEl.appendChild(body);
        dashboard.appendChild(widgetEl);
      });
      requestAnimationFrame(renderAllCharts);
    }
    function renderAllCharts() {
      dashboardConfig.widgets.forEach(function(widget) {
        if (widget.type === "chart") renderChart(widget);
      });
    }
    function renderChart(widget) {
      const canvas = document.getElementById("chart-" + widget.id);
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      chartInstances[widget.id] = new Chart(ctx, buildChartConfig(widget));
    }
    function buildChartConfig(widget) {
      const chartType = widget.chartType === "area" ? "line" : widget.chartType;
      const isCircular = ["pie", "doughnut", "polarArea"].includes(widget.chartType);
      const isRadar = widget.chartType === "radar";
      const isScatter = widget.chartType === "scatter";
      const isArea = widget.chartType === "area";
      const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: true, position: "top" },
          tooltip: { enabled: true }
        }
      };
      if (isScatter) {
        return {
          type: "scatter",
          data: {
            datasets: [{
              label: widget.title || "",
              data: (widget.data && widget.data.points) || [],
              pointRadius: 5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: commonOptions.plugins,
            scales: {
              x: { title: { display: true, text: "Số ngày nợ" } },
              y: { title: { display: true, text: "Giá trị" }, beginAtZero: true }
            }
          }
        };
      }
      return {
        type: chartType,
        data: {
          labels: (widget.data && widget.data.labels) || [],
          datasets: [{
            label: widget.title || "",
            data: (widget.data && widget.data.values) || [],
            fill: isArea,
            tension: 0.35,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: commonOptions.plugins,
          scales: (isCircular || isRadar) ? {} : { y: { beginAtZero: true } }
        }
      };
    }
    function buildTableHtml(columns, rows) {
      let html = "<table><thead><tr>";
      columns.forEach(function(col) { html += "<th>" + escapeHtml(col) + "</th>"; });
      html += "</tr></thead><tbody>";
      rows.forEach(function(row) {
        html += "<tr>";
        row.forEach(function(cell) { html += "<td>" + escapeHtml(cell) + "</td>"; });
        html += "</tr>";
      });
      html += "</tbody></table>";
      return html;
    }
    function reloadData() {
      showStatus("Đã thay đổi bộ lọc: " + JSON.stringify(getFilterValues()));
      renderDashboard();
    }
    function getFilterValues() {
      const result = {};
      dashboardConfig.filters.forEach(function(filter) { result[filter.id] = filter.value; });
      return result;
    }
    function saveLayout() {
      persistLayout();
      showStatus("Đã lưu layout dashboard.");
    }
    function persistLayout() {
      localStorage.setItem("dashboard-layout-" + dashboardConfig.id, JSON.stringify(dashboardConfig.widgets));
    }
    function resetLayout() {
      localStorage.removeItem("dashboard-layout-" + dashboardConfig.id);
      dashboardConfig.widgets = JSON.parse(JSON.stringify(defaultWidgets));
      renderDashboard();
      showStatus("Đã reset về layout mặc định.");
    }
    function showStatus(message) {
      const bar = document.getElementById("statusBar");
      bar.textContent = message || "";
      bar.classList.add("show");
      clearTimeout(showStatus._timer);
      showStatus._timer = setTimeout(function() { bar.classList.remove("show"); }, 2200);
    }
    function onDragStart(e) {
      if (resizeState) { e.preventDefault(); return; }
      dragSourceId = this.dataset.widgetId;
      this.classList.add("dragging");
    }
    function onDragOver(e) { e.preventDefault(); }
    function onDrop(e) {
      e.preventDefault();
      const targetId = this.dataset.widgetId;
      if (!dragSourceId || dragSourceId === targetId) return;
      const sourceIndex = dashboardConfig.widgets.findIndex(function(w) { return w.id === dragSourceId; });
      const targetIndex = dashboardConfig.widgets.findIndex(function(w) { return w.id === targetId; });
      if (sourceIndex < 0 || targetIndex < 0) return;
      const temp = dashboardConfig.widgets[sourceIndex];
      dashboardConfig.widgets[sourceIndex] = dashboardConfig.widgets[targetIndex];
      dashboardConfig.widgets[targetIndex] = temp;
      persistLayout();
      renderDashboard();
    }
    function onDragEnd() {
      this.classList.remove("dragging");
      dragSourceId = null;
    }
    function startWidgetResize(event, widget, widgetEl) {
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      resizeState = {
        widget: widget,
        widgetEl: widgetEl,
        startX: event.clientX,
        startY: event.clientY,
        startWidth: normalizeWidgetWidth(widget),
        startHeight: normalizeWidgetHeight(widget)
      };
      widgetEl.classList.add("resizing");
      document.body.classList.add("widget-resizing");
      window.addEventListener("pointermove", onWidgetResizeMove);
      window.addEventListener("pointerup", stopWidgetResize);
      window.addEventListener("pointercancel", stopWidgetResize);
    }
    function onWidgetResizeMove(event) {
      if (!resizeState) return;
      event.preventDefault();
      const metrics = getGridMetrics();
      const widthDelta = metrics.columnCount === 1 ? 0 : Math.round((event.clientX - resizeState.startX) / (metrics.columnWidth + metrics.gap));
      const heightDelta = Math.round((event.clientY - resizeState.startY) / widgetResizeConfig.heightStepPx);
      resizeState.widget.width = clamp(
        resizeState.startWidth + widthDelta,
        metrics.columnCount === 1 ? 1 : widgetResizeConfig.minWidth,
        Math.min(widgetResizeConfig.maxWidth, metrics.columnCount)
      );
      resizeState.widget.height = clamp(
        resizeState.startHeight + heightDelta,
        widgetResizeConfig.minHeight,
        widgetResizeConfig.maxHeight
      );
      applyWidgetDimensions(resizeState.widget, resizeState.widgetEl);
      applyChartResize(resizeState.widget);
    }
    function stopWidgetResize() {
      if (!resizeState) return;
      resizeState.widgetEl.classList.remove("resizing");
      document.body.classList.remove("widget-resizing");
      window.removeEventListener("pointermove", onWidgetResizeMove);
      window.removeEventListener("pointerup", stopWidgetResize);
      window.removeEventListener("pointercancel", stopWidgetResize);
      persistLayout();
      resizeState = null;
    }
    function applyWidgetDimensions(widget, widgetEl) {
      const width = getGridColumnCount() === 1 ? 1 : normalizeWidgetWidth(widget);
      widgetEl.style.gridColumn = "span " + width;
      widgetEl.style.minHeight = getWidgetMinHeight(widget) + "px";
    }
    function applyChartResize(widget) {
      const canvas = document.getElementById("chart-" + widget.id);
      if (canvas && canvas.parentElement) canvas.parentElement.style.height = getChartCanvasHeight(widget) + "px";
      if (chartInstances[widget.id]) chartInstances[widget.id].resize();
    }
    function prepareWidgetControl(control) {
      control.draggable = false;
      ["pointerdown", "mousedown", "touchstart", "click", "dragstart"].forEach(function(eventName) {
        control.addEventListener(eventName, function(event) { event.stopPropagation(); });
      });
    }
    function normalizeWidgetWidth(widget) { return clamp(Number(widget.width) || widgetResizeConfig.minWidth, widgetResizeConfig.minWidth, widgetResizeConfig.maxWidth); }
    function normalizeWidgetHeight(widget) { return clamp(Number(widget.height) || widgetResizeConfig.minHeight, widgetResizeConfig.minHeight, widgetResizeConfig.maxHeight); }
    function getWidgetMinHeight(widget) { if (widget.type === "chart") return getChartCanvasHeight(widget) + 110; return Math.max(140, normalizeWidgetHeight(widget) * 80 - 20); }
    function getChartCanvasHeight(widget) { return Math.max(220, normalizeWidgetHeight(widget) * 72); }
    function getGridColumnCount() { return window.innerWidth <= 992 ? 1 : 12; }
    function getGridMetrics() {
      const dashboard = document.getElementById("dashboard");
      const styles = window.getComputedStyle(dashboard);
      const gap = Number.parseFloat(styles.columnGap || styles.gap || "16") || 16;
      const columnCount = getGridColumnCount();
      const columnWidth = columnCount === 1 ? dashboard.clientWidth : (dashboard.clientWidth - gap * (columnCount - 1)) / columnCount;
      return { gap: gap, columnCount: columnCount, columnWidth: columnWidth };
    }
    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function formatNumber(value) { return new Intl.NumberFormat("vi-VN").format(Number(value) || 0); }
    function escapeHtml(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    function getChartTypeLabel(type) {
      const found = CHART_TYPES.find(function(item) { return item.value === type; });
      return found ? found.label : String(type || "");
    }
    function destroyCharts() {
      Object.keys(chartInstances).forEach(function(key) {
        if (chartInstances[key]) {
          chartInstances[key].destroy();
          delete chartInstances[key];
        }
      });
    }
    function buildPrintLayout() {
      const root = document.getElementById("printRoot");
      const now = new Date();
      let filterHtml = "";
      dashboardConfig.filters.forEach(function(filter) {
        filterHtml += '<div class="print-filter"><div class="print-filter-label">' + escapeHtml(filter.label) + '</div><div class="print-filter-value">' + escapeHtml(filter.value || "Tất cả") + '</div></div>';
      });
      let cardsHtml = "";
      dashboardConfig.widgets.forEach(function(widget) {
        const width = Math.min(Math.max(Number(widget.width) || 3, 1), 12);
        if (widget.type === "kpi") {
          cardsHtml += '<div class="print-card" style="grid-column: span ' + width + '"><div class="print-card-header">' + escapeHtml(widget.title) + '</div><div class="print-card-body"><div class="print-kpi" style="background:' + (widget.color || "#2563eb") + '"><div class="print-kpi-title">' + escapeHtml(widget.title) + '</div><div class="print-kpi-value">' + formatNumber(widget.value || 0) + '</div><div class="print-kpi-subtitle">' + escapeHtml(widget.subtitle || "") + '</div></div></div></div>';
        }
        if (widget.type === "chart") {
          let chartImage = "";
          const chart = chartInstances[widget.id];
          if (chart) {
            try {
              chart.resize();
              chartImage = chart.toBase64Image();
            } catch (error) {
              console.error("Không chuyển được chart sang ảnh:", error);
            }
          }
          cardsHtml += '<div class="print-card" style="grid-column: span ' + width + '"><div class="print-card-header">' + escapeHtml(widget.title) + ' · ' + escapeHtml(getChartTypeLabel(widget.chartType)) + '</div><div class="print-card-body"><div class="print-chart-box">' + (chartImage ? '<img class="print-chart-image" src="' + chartImage + '" alt="' + escapeHtml(widget.title) + '" />' : '<div style="padding:12px;border:1px dashed #cbd5e1;border-radius:8px;color:#64748b;">Chart chưa sẵn sàng để in.</div>') + '</div></div></div>';
        }
        if (widget.type === "table") {
          cardsHtml += '<div class="print-card" style="grid-column: span ' + width + '"><div class="print-card-header">' + escapeHtml(widget.title) + '</div><div class="print-card-body"><div class="print-table-wrap">' + buildTableHtml(widget.columns || [], widget.rows || []) + '</div></div></div>';
        }
      });
      root.innerHTML = '<div class="print-page"><div class="print-header"><div class="print-title">' + escapeHtml(dashboardConfig.title) + '</div><p class="print-subtitle">Layout in riêng cho PDF · Thời gian xuất: ' + now.toLocaleString("vi-VN") + '</p></div><div class="print-filters">' + filterHtml + '</div><div class="print-grid">' + cardsHtml + '</div></div>';
    }
    function wait(ms) { return new Promise(function(resolve) { setTimeout(resolve, ms); }); }
    function waitForImages(container) {
      const images = Array.from(container.querySelectorAll("img"));
      if (!images.length) return Promise.resolve();
      return Promise.all(images.map(function(img) {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise(function(resolve) {
          const done = function() {
            img.removeEventListener("load", done);
            img.removeEventListener("error", done);
            resolve();
          };
          img.addEventListener("load", done, { once: true });
          img.addEventListener("error", done, { once: true });
        });
      }));
    }
    async function exportPdfLayout() {
      buildPrintLayout();
      const root = document.getElementById("printRoot");
      await wait(100);
      await waitForImages(root);
      await wait(100);
      window.print();
    }
    function bindPrintHooks() {
      window.addEventListener("afterprint", function() {
        document.getElementById("printRoot").innerHTML = "";
      });
    }
    window.addEventListener("resize", function() {
      if (resizeState) return;
      clearTimeout(viewportResizeTimer);
      viewportResizeTimer = setTimeout(function() { renderDashboard(); }, 120);
    });
    init();
  </script>
</body>
</html>
